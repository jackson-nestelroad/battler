name: Publish battler-bug-reporter

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy newly built image to Cloud Run?"
        type: boolean
        default: false
  push:
    tags:
      - "battler-live-v*"
      - "battler-bug-reporter-v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-bug-reporter

jobs:
  build-and-push:
    name: Build & Push Bug Reporter Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=match,pattern=battler-live-v(.*),group=1
            type=match,pattern=battler-bug-reporter-v(.*),group=1
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./battler-bug-reporter
          file: ./battler-bug-reporter/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud
        if: inputs.deploy == true || startsWith(github.ref, 'refs/tags/battler-bug-reporter-v')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        if: inputs.deploy == true || startsWith(github.ref, 'refs/tags/battler-bug-reporter-v')
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: battler-bug-reporter
          region: us-central1
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
