name: Publish battler-server

on:
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: "Promote image to :prod (triggers VM Watchtower restart)?"
        type: boolean
        default: false
  push:
    tags:
      - "battler-live-v*"
      - "battler-server-v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  build-and-push:
    name: Build & Push Server Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=match,pattern=battler-live-v(.*),group=1
            type=match,pattern=battler-server-v(.*),group=1
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
            type=sha,format=short
            type=raw,value=prod,enable=${{ inputs.promote_to_prod == true }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./battler-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
