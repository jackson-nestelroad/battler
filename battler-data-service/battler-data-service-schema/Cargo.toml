[package]
name = "battler-data-service-schema"
version = "0.1.0"
edition = "2024"
description = "WAMP schema for querying Pokémon game data in Rust."
authors = ["Jackson Nestelroad <jackson@nestelroad.com>"]
keywords = ["pokemon", "data"]
license = "MIT"
repository = "https://github.com/jackson-nestelroad/battler/tree/main/battler-data-service/battler-data-service-schema"

[features]
typescript = ["dep:ts-rs", "battler-data/typescript"]

[dependencies]
ahash = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true, optional = true }

battler-data = { workspace = true }
battler-wamp = { workspace = true }
battler-wamp-uri = { workspace = true }
battler-wamp-values = { workspace = true }
battler-wamprat = { workspace = true }
battler-wamprat-error = { workspace = true }
battler-wamprat-message = { workspace = true }
battler-wamprat-schema = { workspace = true }
battler-wamprat-uri = { workspace = true }
